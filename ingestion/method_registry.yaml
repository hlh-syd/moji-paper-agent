# 方法 -> 原论文 注册表
# 用途：
#   1) src/project_indexer.py 用 code_patterns 在研究脚本中匹配方法
#   2) ingestion/build_methods_kb.py 抓取论文元数据/摘要/OA全文，构建 method_papers 向量库
# 字段说明：
#   pubmed_query: 当 pmid 缺失时用 PubMed esearch 兜底检索（验证后人工确认）
#   arxiv_id: 有 arXiv 版本的填，用于抓 OA 全文
#   confidence: high = 元数据已核对; medium = 标题/DOI 可信但未逐字核对; search = 需在构建时经 PubMed 检索确认

