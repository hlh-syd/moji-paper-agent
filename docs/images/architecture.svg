    <text x="772" y="142" font-size="12.5" fill="#6366f1">大纲 · 分节 · 自查 · docx</text>
  </g>
  <rect x="950" y="66" width="284" height="118" rx="12" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.5"/>
