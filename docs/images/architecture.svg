    <text x="479" y="779" fill="#92400e" font-weight="bold">GLM-5.3-Flash（云）</text>
    <text x="479" y="796" font-size="11" fill="#b45309">理解 Agent · 视觉 · 轻任务</text>
    <rect x="626" y="758" width="262" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <text x="757" y="779" fill="#92400e" font-weight="bold">Ollama qwen3:4b（本地）</text>
    <text x="757" y="796" font-size="11" fill="#b45309">会话回退 · 离线可用</text>
    <rect x="904" y="758" width="306" height="46" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <text x="1057" y="779" fill="#92400e" font-weight="bold">Ollama bge-m3（本地嵌入）</text>
    <text x="1057" y="796" font-size="11" fill="#b45309">Chroma 与 LightRAG 共用</text>
