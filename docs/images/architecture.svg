    <text x="1083" y="506" font-size="12" fill="#059669">LightRAG 多模态知识图谱</text>
    <text x="1083" y="526" font-size="12" fill="#059669">失败优雅降级</text>
    <rect x="672" y="556" width="542" height="92" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="943" y="582" font-size="13" font-weight="bold" fill="#065f46">文献入库流水线</text>
    <text x="943" y="606" font-size="12" fill="#059669">reference_papers/*.pdf → MinerU 分块 → GLM 看图/表格语义化</text>
    <text x="943" y="626" font-size="12" fill="#059669">→ 图谱混合索引 → 会话问答 / 写作证据自动注入</text>
  </g>

