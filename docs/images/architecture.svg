    <text x="1092" y="122" font-size="12.5" fill="#c026d3">admin / user 角色权限</text>
    <text x="1092" y="142" font-size="12.5" fill="#c026d3">pbkdf2 + HMAC 令牌</text>
    <text x="1092" y="162" font-size="12.5" fill="#c026d3">项目/文档/会话按用户隔离</text>
