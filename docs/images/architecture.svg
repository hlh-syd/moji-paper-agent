  </g>

  <!-- ═══ 知识层 ═══ -->
  <text x="652" y="400" font-size="15" font-weight="bold" fill="#047857">知识层 · 双知识库 RAG + 多模态文献</text>
  <rect x="652" y="414" width="582" height="252" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <g text-anchor="middle">
    <rect x="672" y="434" width="262" height="106" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="803" y="462" font-size="13" font-weight="bold" fill="#065f46">Chroma 向量库</text>
    <text x="803" y="486" font-size="12" fill="#059669">方法原论文库（70+ 生存分析）</text>
    <text x="803" y="506" font-size="12" fill="#059669">写作教学库（Phrasebank 等）</text>
    <text x="803" y="526" font-size="12" fill="#059669">bge-m3 嵌入 · 多 collection</text>
    <rect x="952" y="434" width="262" height="106" rx="8" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="1083" y="462" font-size="13" font-weight="bold" fill="#065f46">RAG-Anything 引擎</text>
